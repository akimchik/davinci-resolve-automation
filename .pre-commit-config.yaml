repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/alessandromanzeni/luacheck-pre-commit
    rev: v0.1.0
    hooks:
      - id: luacheck
        args: ["--globals", "resolve", "Resolve", "DIVE_DATE", "res", "project", "mediapool", "timeline", "master_timeline", "project_manager", "media_storage"]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, chore, docs, style, refactor, perf, test]
